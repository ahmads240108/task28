<body>

  <nav class="navbar navbar-expand-lg navbar-dark bg-danger">
    <div class="container">
      <a class="navbar-brand" href="#">Navbar</a>
      <button
        class="navbar-toggler"
        type="button"
        data-bs-toggle="collapse"
        data-bs-target="#navbarNav"
        aria-controls="navbarNav"
        aria-expanded="false"
        aria-label="Toggle navigation"

        <i class="fas fa-bars"></i>
      </button>

  <div class="container content">
    <h3 id="demo"></h3>
    <button class="btn btn-danger" onclick="clearInterval(timer)">Stop</button>
    <button class="btn btn-success" onclick="timer = setInterval(myTimer, 1000)">Continue</button>

    <hr class="my-4" />

    <h4>Alert after 3 seconds</h4>
    <button class="btn btn-primary" onclick="delay = setTimeout(getData, 3000)">Click</button>
    <button class="btn btn-secondary" onclick="clearTimeout(delay)">Stop</button>
  </div>

  <!-- wow js -->
  <script src="/js/wow.min.js"></script>

    new WOW().init();
  </script>

  <!-- main js -->
  <script src="/js/main.js"></script>
